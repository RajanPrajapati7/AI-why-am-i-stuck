services:
  # Backend Web Service (Node.js / Express API)
  - type: web
    name: ai-why-am-i-stuck-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: ai-why-am-i-stuck-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: ai-why-am-i-stuck-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SAME_SITE
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info

  # Frontend Static Site (React / Vite SPA)
  - type: web
    name: ai-why-am-i-stuck-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-why-am-i-stuck-backend
          envVarKey: RENDER_EXTERNAL_URL
